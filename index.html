
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>田所千佳 判定ゲーム</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #171717;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 20px;
}
h1 { font-size: 26px; margin-top: 20px; }
.subtitle { color: #aaa; }
.game {
  max-width: 500px;
  margin: 25px auto;
  background: #292929;
  padding: 20px;
  border-radius: 18px;
}
#photo {
  width: 100%;
  height: 330px;
  object-fit: contain;
  background: #111;
  border-radius: 12px;
}
.question {
  font-size: 20px;
  font-weight: bold;
  margin: 20px 0;
}
.buttons {
  display: flex;
  gap: 15px;
}
button {
  flex: 1;
  padding: 20px;
  border: none;
  border-radius: 12px;
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
}
#maru { background: #3188ed; color: white; }
#batsu { background: #e34d4d; color: white; }
button:disabled { opacity: .5; }
#message {
  font-size: 22px;
  font-weight: bold;
  margin: 20px 0;
  min-height: 30px;
}
#next {
  display: none;
  width: 100%;
  background: #f2c94c;
  color: #222;
  font-size: 19px;
}
#result { font-size: 22px; margin: 20px; }
#restart {
  display: none;
  background: #f2c94c;
  color: #222;
  font-size: 20px;
  width: 100%;
}
.info { color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<h1>田所千佳 判定ゲーム</h1>
<p class="subtitle">この画像は田所千佳なのか？</p>

<div class="game">
  <p id="progress">第1問</p>
  <img id="photo" src="" alt="問題画像">

  <div class="question">
    これは田所千佳である？
  </div>

  <div class="buttons">
    <button id="maru" onclick="answer(true)">○</button>
    <button id="batsu" onclick="answer(false)">×</button>
  </div>

  <div id="message"></div>
  <p id="score">正解数：0</p>

  <button id="next" onclick="nextQuestion()">次の問題 →</button>
  <button id="restart" onclick="startGame()">もう一度遊ぶ</button>
</div>

<p class="info">全10問・目指せ全問正解！</p>

<script>
// 画像と正解を設定
// answer: true = 田所千佳 / false = 田所千佳ではない

const questions = [
  { image: "images/1.jpg", answer: true },
  { image: "images/2.jpg", answer: false },
  { image: "images/3.jpg", answer: true },
  { image: "images/4.jpg", answer: false },
  { image: "images/5.jpg", answer: true },
  { image: "images/6.jpg", answer: false },
  { image: "images/7.jpg", answer: true },
  { image: "images/8.jpg", answer: false },
  { image: "images/9.jpg", answer: true },
  { image: "images/10.jpg", answer: false }
];

let current = 0;
let score = 0;
let answered = false;
let quiz = [];

function startGame() {
  current = 0;
  score = 0;
  answered = false;

  quiz = [...questions].sort(() => Math.random() - 0.5);

  document.getElementById("restart").style.display = "none";
  showQuestion();
}

function showQuestion() {
  answered = false;

  const q = quiz[current];

  document.getElementById("photo").src = q.image;
  document.getElementById("progress").textContent =
    `第${current + 1}問 / ${quiz.length}問`;

  document.getElementById("score").textContent =
    `正解数：${score}`;

  document.getElementById("message").textContent = "";
  document.getElementById("next").style.display = "none";

  document.getElementById("maru").disabled = false;
  document.getElementById("batsu").disabled = false;
}

function answer(choice) {
  if (answered) return;
  answered = true;

  const correct = choice === quiz[current].answer;

  if (correct) {
    score++;
    document.getElementById("message").textContent = "⭕ 正解！！";
    document.getElementById("message").style.color = "#55dd88";
  } else {
    document.getElementById("message").textContent = "❌ 不正解...";
    document.getElementById("message").style.color = "#ff6666";
  }

  document.getElementById("score").textContent =
    `正解数：${score}`;

  document.getElementById("maru").disabled = true;
  document.getElementById("batsu").disabled = true;

  const next = document.getElementById("next");
  next.style.display = "block";
  next.textContent =
    current === quiz.length - 1 ? "結果を見る" : "次の問題 →";
}

function nextQuestion() {
  current++;

  if (current >= quiz.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById("photo").style.display = "none";
  document.querySelector(".question").style.display = "none";
  document.querySelector(".buttons").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("progress").textContent = "結果発表";

  const rate = Math.round(score / quiz.length * 100);

  document.getElementById("message").textContent =
    `${score} / ${quiz.length} 問正解！`;

  document.getElementById("score").textContent =
    `正答率：${rate}%`;

  document.getElementById("restart").style.display = "block";
}

// 画像読み込みエラー
document.getElementById("photo").onerror = function() {
  this.alt = "画像が見つかりません。画像の保存場所を確認してください。";
};

startGame();
</script>

</body>
</html>
